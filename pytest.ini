[pytest]
# Only this project's own tests. Without this, a bare `pytest` from the
# repo root also collects third_party/gym-pybullet-drones/tests/, which
# needs that vendored package's own heavy extras (torch, stable-baselines3)
# installed - deliberately skipped here via `pip install --no-deps` (see
# README's Setup section) since this project's code never imports them.
# To run those vendored tests too, install gym-pybullet-drones's full
# requirements (i.e. without --no-deps) and run pytest against that
# directory directly - see docs/PHASE1_CONTRACT.md, "Running tests".
testpaths = tests
